[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plandelta"
version = "0.1.0"
description = "Compare a plan document against what actually shipped, with cited evidence."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "oh-namgyu" }]
keywords = ["plan", "retrospective", "traceability", "markdown", "llm", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
plandelta = "plandelta.__main__:main"

[project.urls]
Homepage = "https://github.com/oh-namgyu/plandelta"
Issues = "https://github.com/oh-namgyu/plandelta/issues"

[tool.setuptools]
packages = ["plandelta", "plandelta.engines"]
